spring:
  application:
    name: "manager-service"

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: micro-1

  datasource:
    url: jdbc://db-url
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 6060

jwt:
  secret: yourSecret